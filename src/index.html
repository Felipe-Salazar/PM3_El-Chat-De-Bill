<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <title>El chat de Bill</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <svg class="filtros" width="0" height="0" aria-hidden="true">
        <filter id="tinta" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" result="ruido"/>
            <feDisplacementMap in="SourceGraphic" in2="ruido" scale="15"/>
        </filter>
    </svg>

    <div class="chat-container">
        <header class="chat-header">
            <button class="btn-icono" id="btn-volver" aria-label="Volver">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <img src="img/bill-icon.png" alt="bill-icon" class="icono-perfil">
            <div class="texto-header">
                <h1>Bill Cipher?</h1>
                <p>Siempre en línea</p>
            </div>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="message message--bot">
                <p>¡Aquí estamos al fin! He esperado una eternidad para conocerte. Tu vida estará dividida para siempre antes y después de conocerme. BIENVENIDO AL DESPUÉS.</p>
            </div>
            <div class="message message--user">
                <p>Bill, eres un ser todopoderoso ¿Por qué estás en un chat?</p>
            </div>
        </main>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="chatInput" placeholder="Sin misterio, solo escribe..." autocomplete="off" aria-label="Mensaje">
            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>
